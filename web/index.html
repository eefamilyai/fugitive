<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0B0F15" />
    <meta name="description" content="Fugitive — real-world manhunt. Hunters track, runners hide, the zone shrinks." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Fugitive — real-world manhunt</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="apk-banner" style="display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;background:#f97316;color:#fff;border-radius:10px;font-family:system-ui,sans-serif;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.4);max-width:calc(100vw - 32px);">
      <a href="https://github.com/eefamilyai/fugitive/releases/download/v1.0.1/app-release.apk" style="color:#fff;text-decoration:none;padding:6px 4px;">Download Android APK</a>
      <button id="apk-close" aria-label="Close" style="background:transparent;border:0;color:#fff;font-size:20px;line-height:1;cursor:pointer;padding:4px 10px;">×</button>
    </div>
    <script>
      // Show the APK banner once; a dismissal is remembered so it never returns.
      (function () {
        var KEY = "fugitive-apk-banner-dismissed";
        var banner = document.getElementById("apk-banner");
        var close = document.getElementById("apk-close");
        try { if (localStorage.getItem(KEY)) return; } catch (e) {}
        banner.style.display = "flex";
        close.addEventListener("click", function () {
          banner.style.display = "none";
          try { localStorage.setItem(KEY, "1"); } catch (e) {}
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
