server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Hashed build assets never change: cache for a year.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /map-previews/ { add_header Cache-Control "public, max-age=604800"; }
  # Runtime config must always be fresh.
  location = /config.json { add_header Cache-Control "no-store"; }
  location = /healthz { access_log off; return 200 "ok"; }

  # Geolocation is required by the game.
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Single-page app: /lobby, /join/ABC123 … all serve index.html.
  location / { try_files $uri $uri/ /index.html; }
}
